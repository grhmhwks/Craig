services:
  craig:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CRAIG_MODEL_PROVIDER: "${CRAIG_MODEL_PROVIDER:-demo}"
      CRAIG_MODEL: "${CRAIG_MODEL:-}"
      CRAIG_MODEL_BASE_URL: "${CRAIG_MODEL_BASE_URL:-}"
      CRAIG_MODEL_API_KEY: "${CRAIG_MODEL_API_KEY:-}"
      CRAIG_MODEL_TIMEOUT_SECONDS: "${CRAIG_MODEL_TIMEOUT_SECONDS:-60}"
      CRAIG_MODEL_MAX_OUTPUT_TOKENS: "${CRAIG_MODEL_MAX_OUTPUT_TOKENS:-2000}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    volumes:
      - craig-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  craig-data:

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "craig-local"
version = "0.1.0"
description = "Local, read-only indexing and search for the CRAIG mathematical corpus"
readme = "Combinatorics_README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["craig*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

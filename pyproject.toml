[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "craig-local"
version = "0.5.0"
description = "Provenance-aware conversational exploration of the CRAIG mathematical corpus"
readme = "Combinatorics_README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "anyio>=4,<5",
    "httpx>=0.27,<1",
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["craig*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
